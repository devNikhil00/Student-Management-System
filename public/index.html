<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Management</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
  <!-- Header Section -->
  <header>
    <nav>
      <div class="logo">Student Management System</div>
      <ul class="nav-links">
        <li><a href="#form-section">Add Student</a></li>
        <li><a href="#students-section">Students</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Section -->
  <main>
    <!-- Form Section -->
    <section id="form-section">
      <h2>Add Student</h2>
      <form id="studentForm">
        <!-- Personal Details Section -->
        <h3>Personal Details</h3>
        <div class="form-group">
          <label for="name">Name*</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="rollNumber">Roll Number*</label>
          <input type="text" id="rollNumber" name="rollNumber" required>
        </div>
        <div class="form-group">
          <label for="email">Email*</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="dateOfBirth">Date of Birth</label>
          <input type="date" name="dateOfBirth" id="dateOfBirth">
        </div>
        <div class="form-group">
          <label for="address">Address</label>
          <input type="text" name="address" id="address">
        </div>
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="text" name="phone" id="phone">
        </div>
        <!-- Academic Details Section -->
        <h3>Academic Details</h3>
        <div class="form-group">
          <label for="course">Course*</label>
          <input type="text" id="course" name="course" required>
        </div>
        <div class="form-group">
          <label for="branch">Branch*</label>
          <input type="text" id="branch" name="branch" required>
        </div>
        <div class="form-group">
          <label for="semester">Semester*</label>
          <input type="number" id="semester" name="semester" required min="1" max="8">
        </div>
        <div class="form-group">
          <label for="cgpa">CGPA*</label>
          <input type="number" id="cgpa" name="cgpa" required min="0" max="10" step="0.01">
        </div>
        <!-- Attendance Section -->
        <h3>Attendance</h3>
        <div class="form-group">
          <label for="totalDays">Total Days</label>
          <input type="number" id="totalDays" name="totalDays" min="0">
        </div>
        <div class="form-group">
          <label for="daysPresent">Days Present</label>
          <input type="number" id="daysPresent" name="daysPresent" min="0">
        </div>
        <button type="submit">Submit</button>
      </form>
    </section>

    <!-- Students List Section -->
    <section id="students-section">
      <h2>Students List</h2>
      <div class="student-cards" id="studentCards">
        <!-- Student cards will be dynamically added here -->
      </div>
    </section>
  </main>

  <!-- Footer Section -->
  <footer>
    <p>© 2025 Student Management System | All rights reserved</p>
  </footer>

  <!-- CDN Links -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
